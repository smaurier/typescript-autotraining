<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 03 — Objets & Interfaces</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; color: #ffffff; }
    .subtitle { text-align: center; color: #8892b0; margin-bottom: 2rem; font-size: 1rem; }
    .progress-bar-container { background: #0d1117; border-radius: 10px; height: 14px; margin-bottom: 2rem; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #0d6efd, #4dabf7); height: 100%; width: 0%; border-radius: 10px; transition: width 0.4s ease; }
    .progress-text { text-align: center; color: #8892b0; margin-bottom: 1rem; font-size: 0.9rem; }
    .card { background: #16213e; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .question-label { font-size: 0.85rem; color: #4dabf7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .question-text { font-size: 1.15rem; margin-bottom: 1.2rem; line-height: 1.5; color: #ffffff; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; overflow-x: auto; font-size: 0.95rem; }
    code { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; color: #c9d1d9; }
    .options { list-style: none; }
    .options li { margin-bottom: 0.5rem; }
    .options label { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; background: #0d1117; border: 2px solid #30363d; border-radius: 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s; font-size: 1rem; }
    .options label:hover { border-color: #4dabf7; background: #1c2a4a; }
    .options input[type="radio"] { accent-color: #0d6efd; width: 18px; height: 18px; flex-shrink: 0; }
    .btn { display: inline-block; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-primary { background: #0d6efd; color: #fff; }
    .btn-primary:hover { background: #3b82f6; }
    .btn-primary:disabled { background: #374151; cursor: not-allowed; }
    .btn-restart { background: #238636; color: #fff; margin-top: 1rem; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-restart:hover { background: #2ea043; }
    .feedback { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; display: none; }
    .feedback.correct { background: #0f5132; border: 1px solid #198754; color: #d1fae5; display: block; }
    .feedback.wrong { background: #842029; border: 1px solid #dc3545; color: #fdd; display: block; }
    .score-card { text-align: center; padding: 3rem 2rem; }
    .score-card .score { font-size: 3rem; font-weight: 700; color: #4dabf7; margin-bottom: 0.5rem; }
    .score-card .score-label { font-size: 1.2rem; color: #8892b0; margin-bottom: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz 03 — Objets & Interfaces</h1>
    <p class="subtitle">Interfaces, type aliases, structural typing</p>
    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    <p class="progress-text" id="progressText">Question 1 / 5</p>
    <div id="quizContainer"></div>
    <div id="scoreContainer" class="card score-card hidden"></div>
  </div>
  <script>
    const questions = [
      {
        label: "Question 1",
        text: "Quand devrait-on preferer une interface a un type alias ?",
        code: "// Interface\ninterface User {\n  name: string;\n  age: number;\n}\n\n// Type alias\ntype User = {\n  name: string;\n  age: number;\n};",
        options: [
          "Toujours utiliser des interfaces, les types sont deprecies",
          "Les interfaces sont preferees pour les formes d'objets car elles supportent l'extension et la fusion de declarations",
          "Les types sont toujours superieurs car ils supportent les unions",
          "Il n'y a aucune difference, c'est purement esthetique"
        ],
        answer: 1,
        explanation: "Les interfaces sont generalement preferees pour definir des formes d'objets car elles supportent la declaration merging et l'heritage avec extends de facon naturelle. Les type aliases sont indispensables pour les unions, intersections, tuples et types primitifs. En pratique, pour un objet simple, les deux fonctionnent, mais la convention est d'utiliser interface pour les contrats d'objets."
      },
      {
        label: "Question 2",
        text: "Que se passe-t-il quand deux interfaces portent le meme nom dans le meme scope ?",
        code: "interface Config {\n  host: string;\n}\n\ninterface Config {\n  port: number;\n}\n\nconst cfg: Config = {\n  host: 'localhost',\n  port: 3000\n};",
        options: [
          "TypeScript signale une erreur de nom duplique",
          "La deuxieme declaration ecrase la premiere",
          "Les deux declarations sont fusionnees (declaration merging)",
          "Seule la premiere declaration est prise en compte"
        ],
        answer: 2,
        explanation: "C'est le mecanisme de declaration merging : quand deux interfaces ont le meme nom, TypeScript fusionne automatiquement leurs membres. Le type final Config contient a la fois host et port. C'est un comportement specifique aux interfaces — les type aliases ne le supportent pas et produiraient une erreur. Ce mecanisme est tres utile pour etendre des types de bibliotheques tierces."
      },
      {
        label: "Question 3",
        text: "Que garantit le modificateur readonly sur une propriete ?",
        code: "interface Point {\n  readonly x: number;\n  readonly y: number;\n}\n\nconst p: Point = { x: 10, y: 20 };\np.x = 30; // Erreur ?",
        options: [
          "La propriete est gelee a l'execution avec Object.freeze()",
          "La propriete ne peut pas etre reassignee apres l'initialisation (verification a la compilation uniquement)",
          "La propriete est supprimee du type a la compilation",
          "La propriete devient accessible uniquement en lecture via un getter"
        ],
        answer: 1,
        explanation: "readonly est une verification a la compilation uniquement. TypeScript empechera toute reassignation de la propriete apres l'initialisation de l'objet, mais cela ne genere aucun code a l'execution. L'objet JavaScript resultant est toujours mutable. Pour une immutabilite a l'execution, il faudrait combiner avec Object.freeze()."
      },
      {
        label: "Question 4",
        text: "Que permet une index signature dans une interface ?",
        code: "interface StringMap {\n  [key: string]: number;\n}\n\nconst scores: StringMap = {\n  alice: 95,\n  bob: 87\n};",
        options: [
          "Elle limite l'objet a exactement une propriete",
          "Elle permet a l'objet d'avoir un nombre quelconque de proprietes avec des cles et valeurs du type specifie",
          "Elle cree un tableau indexe par des chaines",
          "Elle est equivalente a un Map&lt;string, number&gt;"
        ],
        answer: 1,
        explanation: "Une index signature [key: string]: Type permet de declarer qu'un objet peut avoir un nombre arbitraire de proprietes, tant que les cles sont du type specifie (string ou number) et les valeurs du type donne. C'est utile pour les dictionnaires et les objets dynamiques. Attention : toutes les proprietes nommees de l'interface doivent aussi etre compatibles avec le type de l'index signature."
      },
      {
        label: "Question 5",
        text: "Qu'est-ce que le typage structurel (structural typing) en TypeScript ?",
        code: "interface Point {\n  x: number;\n  y: number;\n}\n\nconst obj = { x: 1, y: 2, z: 3 };\nconst p: Point = obj; // OK ou Erreur ?",
        options: [
          "Deux types sont compatibles uniquement s'ils ont le meme nom",
          "Deux types sont compatibles si leur structure (proprietes et types) est compatible, peu importe le nom",
          "TypeScript verifie l'heritage de classes pour determiner la compatibilite",
          "Le typage structurel n'existe qu'avec le mot-cle structural"
        ],
        answer: 1,
        explanation: "TypeScript utilise un systeme de typage structurel (aussi appele duck typing) : deux types sont compatibles si leurs structures le sont. Dans l'exemple, obj a les proprietes x et y de type number, donc il est compatible avec Point, meme s'il a une propriete supplementaire z. Attention : l'assignation directe d'un objet literal declencherait un excess property check, mais passer par une variable intermediaire le contourne."
      }
    ];

    let currentQuestion = 0, score = 0, answered = false;

    function renderQuestion() {
      const q = questions[currentQuestion];
      const total = questions.length;
      document.getElementById('progressBar').style.width = ((currentQuestion / total) * 100) + '%';
      document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} / ${total}`;
      let html = `<div class="card">
        <p class="question-label">${q.label}</p>
        <p class="question-text">${q.text}</p>`;
      if (q.code) {
        html += `<pre><code>${q.code}</code></pre>`;
      }
      html += `<ul class="options">`;
      q.options.forEach((opt, i) => {
        html += `<li><label><input type="radio" name="q" value="${i}"> ${opt}</label></li>`;
      });
      html += `</ul>
        <button class="btn btn-primary" id="validateBtn" onclick="validate()" disabled>Valider</button>
        <div class="feedback" id="feedback"></div>
      </div>`;
      document.getElementById('quizContainer').innerHTML = html;
      document.querySelectorAll('input[name="q"]').forEach(r => {
        r.addEventListener('change', () => {
          document.getElementById('validateBtn').disabled = false;
        });
      });
      answered = false;
    }

    function validate() {
      if (answered) {
        currentQuestion++;
        if (currentQuestion < questions.length) {
          renderQuestion();
        } else {
          showScore();
        }
        return;
      }
      answered = true;
      const selected = document.querySelector('input[name="q"]:checked');
      if (!selected) return;
      const val = parseInt(selected.value);
      const q = questions[currentQuestion];
      const fb = document.getElementById('feedback');
      const btn = document.getElementById('validateBtn');
      document.querySelectorAll('input[name="q"]').forEach(r => r.disabled = true);
      if (val === q.answer) {
        score++;
        fb.className = 'feedback correct';
        fb.innerHTML = `<strong>Correct !</strong> ${q.explanation}`;
      } else {
        fb.className = 'feedback wrong';
        fb.innerHTML = `<strong>Incorrect.</strong> ${q.explanation}`;
      }
      btn.textContent = currentQuestion < questions.length - 1 ? 'Suivant' : 'Voir le score';
    }

    function showScore() {
      document.getElementById('quizContainer').classList.add('hidden');
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('progressText').textContent = `Termine !`;
      const sc = document.getElementById('scoreContainer');
      sc.classList.remove('hidden');
      const pct = Math.round((score / questions.length) * 100);
      let msg = pct === 100 ? 'Parfait !' : pct >= 60 ? 'Bien joue !' : 'Continuez a reviser !';
      sc.innerHTML = `<div class="score">${score} / ${questions.length}</div>
        <div class="score-label">${msg} (${pct}%)</div>
        <button class="btn-restart" onclick="restart()">Recommencer</button>`;
    }

    function restart() {
      currentQuestion = 0; score = 0; answered = false;
      document.getElementById('scoreContainer').classList.add('hidden');
      document.getElementById('quizContainer').classList.remove('hidden');
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
