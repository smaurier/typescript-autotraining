<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 04 — Narrowing</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; color: #ffffff; }
    .subtitle { text-align: center; color: #8892b0; margin-bottom: 2rem; font-size: 1rem; }
    .progress-bar-container { background: #0d1117; border-radius: 10px; height: 14px; margin-bottom: 2rem; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #0d6efd, #4dabf7); height: 100%; width: 0%; border-radius: 10px; transition: width 0.4s ease; }
    .progress-text { text-align: center; color: #8892b0; margin-bottom: 1rem; font-size: 0.9rem; }
    .card { background: #16213e; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .question-label { font-size: 0.85rem; color: #4dabf7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .question-text { font-size: 1.15rem; margin-bottom: 1.2rem; line-height: 1.5; color: #ffffff; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; overflow-x: auto; font-size: 0.95rem; }
    code { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; color: #c9d1d9; }
    .options { list-style: none; }
    .options li { margin-bottom: 0.5rem; }
    .options label { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; background: #0d1117; border: 2px solid #30363d; border-radius: 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s; font-size: 1rem; }
    .options label:hover { border-color: #4dabf7; background: #1c2a4a; }
    .options input[type="radio"] { accent-color: #0d6efd; width: 18px; height: 18px; flex-shrink: 0; }
    .btn { display: inline-block; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-primary { background: #0d6efd; color: #fff; }
    .btn-primary:hover { background: #3b82f6; }
    .btn-primary:disabled { background: #374151; cursor: not-allowed; }
    .btn-restart { background: #238636; color: #fff; margin-top: 1rem; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-restart:hover { background: #2ea043; }
    .feedback { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; display: none; }
    .feedback.correct { background: #0f5132; border: 1px solid #198754; color: #d1fae5; display: block; }
    .feedback.wrong { background: #842029; border: 1px solid #dc3545; color: #fdd; display: block; }
    .score-card { text-align: center; padding: 3rem 2rem; }
    .score-card .score { font-size: 3rem; font-weight: 700; color: #4dabf7; margin-bottom: 0.5rem; }
    .score-card .score-label { font-size: 1.2rem; color: #8892b0; margin-bottom: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz 04 — Narrowing</h1>
    <p class="subtitle">Unions, discriminated unions, type guards</p>
    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    <p class="progress-text" id="progressText">Question 1 / 5</p>
    <div id="quizContainer"></div>
    <div id="scoreContainer" class="card score-card hidden"></div>
  </div>
  <script>
    const questions = [
      {
        label: "Question 1",
        text: "Comment TypeScript narrow-t-il le type d'une variable apres un typeof check ?",
        code: "function print(value: string | number) {\n  if (typeof value === 'string') {\n    // Quel est le type de value ici ?\n    console.log(value.toUpperCase());\n  } else {\n    // Et ici ?\n    console.log(value.toFixed(2));\n  }\n}",
        options: [
          "value reste string | number dans les deux branches",
          "Dans le if, value est string ; dans le else, value est number",
          "TypeScript ignore le typeof et garde le type d'origine",
          "typeof ne fonctionne qu'avec le type any"
        ],
        answer: 1,
        explanation: "TypeScript analyse le flux de controle (control flow analysis). Apres typeof value === 'string', il sait que dans la branche if, value est forcement string. Dans la branche else, il deduit par elimination que value est number. Ce mecanisme s'appelle le narrowing et fonctionne avec typeof, instanceof, in, et d'autres gardes."
      },
      {
        label: "Question 2",
        text: "Quel est le pattern d'une union discriminee (discriminated union) ?",
        code: "type Shape =\n  | { kind: 'circle'; radius: number }\n  | { kind: 'rect'; width: number; height: number };\n\nfunction area(s: Shape): number {\n  switch (s.kind) {\n    case 'circle': return Math.PI * s.radius ** 2;\n    case 'rect': return s.width * s.height;\n  }\n}",
        options: [
          "Chaque variante de l'union partage une propriete commune (tag) avec une valeur literal unique",
          "Chaque variante a un nombre different de proprietes",
          "On utilise instanceof pour distinguer les variantes",
          "Les variantes sont distinguees par leur nom de type"
        ],
        answer: 0,
        explanation: "Une union discriminee (ou tagged union) est un pattern ou chaque variante possede une propriete commune (ici kind) avec une valeur literal unique ('circle', 'rect'). En testant cette propriete tag, TypeScript peut narrower automatiquement vers la variante correcte et donner acces aux proprietes specifiques. C'est l'un des patterns les plus puissants et frequents en TypeScript."
      },
      {
        label: "Question 3",
        text: "Comment cree-t-on un type guard personnalise en TypeScript ?",
        code: "interface Fish { swim(): void; }\ninterface Bird { fly(): void; }\n\nfunction isFish(pet: Fish | Bird): pet is Fish {\n  return (pet as Fish).swim !== undefined;\n}",
        options: [
          "En utilisant typeof dans le corps de la fonction",
          "En annotant le type de retour avec la syntaxe 'param is Type'",
          "En utilisant le mot-cle guard avant la fonction",
          "En retournant le type au lieu d'un boolean"
        ],
        answer: 1,
        explanation: "Un type guard personnalise est une fonction dont le type de retour utilise la syntaxe 'param is Type'. Quand cette fonction retourne true, TypeScript narrow le type du parametre dans le bloc conditionnel. C'est essentiel quand typeof et instanceof ne suffisent pas, par exemple pour distinguer deux interfaces qui n'ont pas de propriete tag commune."
      },
      {
        label: "Question 4",
        text: "A quoi sert l'exhaustive check avec never dans un switch ?",
        code: "type Direction = 'north' | 'south' | 'east' | 'west';\n\nfunction move(dir: Direction) {\n  switch (dir) {\n    case 'north': return [0, 1];\n    case 'south': return [0, -1];\n    case 'east': return [1, 0];\n    case 'west': return [-1, 0];\n    default:\n      const _exhaustive: never = dir;\n      return _exhaustive;\n  }\n}",
        options: [
          "Il empeche la fonction de retourner undefined",
          "Il garantit a la compilation que tous les cas de l'union sont traites",
          "Il convertit les erreurs runtime en erreurs de compilation",
          "Il optimise les performances du switch"
        ],
        answer: 1,
        explanation: "Dans le default, si tous les cas sont traites, dir est de type never (aucune valeur possible). L'assigner a une variable de type never compile sans erreur. Mais si on ajoute une nouvelle valeur a Direction (ex: 'northwest') sans ajouter le case correspondant, dir ne sera plus never dans le default, et TypeScript signalera une erreur de compilation. C'est une securite precieuse pour ne jamais oublier un cas."
      },
      {
        label: "Question 5",
        text: "Comment instanceof permet-il le narrowing en TypeScript ?",
        code: "class ApiError {\n  constructor(public status: number, public message: string) {}\n}\n\nclass NetworkError {\n  constructor(public url: string) {}\n}\n\nfunction handleError(err: ApiError | NetworkError) {\n  if (err instanceof ApiError) {\n    console.log(`API ${err.status}: ${err.message}`);\n  } else {\n    console.log(`Reseau: ${err.url}`);\n  }\n}",
        options: [
          "instanceof verifie le nom du type a la compilation uniquement",
          "instanceof est une verification runtime qui teste la chaine de prototypes, et TypeScript narrow en consequence",
          "instanceof ne fonctionne qu'avec les interfaces",
          "instanceof compare les proprietes structurellement"
        ],
        answer: 1,
        explanation: "instanceof est un operateur JavaScript qui verifie a l'execution si un objet est une instance d'une classe (via la chaine de prototypes). TypeScript l'utilise pour le narrowing : apres err instanceof ApiError, TypeScript sait que err est de type ApiError dans cette branche. Contrairement a typeof (limite aux types primitifs), instanceof fonctionne avec les classes et constructeurs."
      }
    ];

    let currentQuestion = 0, score = 0, answered = false;

    function renderQuestion() {
      const q = questions[currentQuestion];
      const total = questions.length;
      document.getElementById('progressBar').style.width = ((currentQuestion / total) * 100) + '%';
      document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} / ${total}`;
      let html = `<div class="card">
        <p class="question-label">${q.label}</p>
        <p class="question-text">${q.text}</p>`;
      if (q.code) {
        html += `<pre><code>${q.code}</code></pre>`;
      }
      html += `<ul class="options">`;
      q.options.forEach((opt, i) => {
        html += `<li><label><input type="radio" name="q" value="${i}"> ${opt}</label></li>`;
      });
      html += `</ul>
        <button class="btn btn-primary" id="validateBtn" onclick="validate()" disabled>Valider</button>
        <div class="feedback" id="feedback"></div>
      </div>`;
      document.getElementById('quizContainer').innerHTML = html;
      document.querySelectorAll('input[name="q"]').forEach(r => {
        r.addEventListener('change', () => {
          document.getElementById('validateBtn').disabled = false;
        });
      });
      answered = false;
    }

    function validate() {
      if (answered) {
        currentQuestion++;
        if (currentQuestion < questions.length) {
          renderQuestion();
        } else {
          showScore();
        }
        return;
      }
      answered = true;
      const selected = document.querySelector('input[name="q"]:checked');
      if (!selected) return;
      const val = parseInt(selected.value);
      const q = questions[currentQuestion];
      const fb = document.getElementById('feedback');
      const btn = document.getElementById('validateBtn');
      document.querySelectorAll('input[name="q"]').forEach(r => r.disabled = true);
      if (val === q.answer) {
        score++;
        fb.className = 'feedback correct';
        fb.innerHTML = `<strong>Correct !</strong> ${q.explanation}`;
      } else {
        fb.className = 'feedback wrong';
        fb.innerHTML = `<strong>Incorrect.</strong> ${q.explanation}`;
      }
      btn.textContent = currentQuestion < questions.length - 1 ? 'Suivant' : 'Voir le score';
    }

    function showScore() {
      document.getElementById('quizContainer').classList.add('hidden');
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('progressText').textContent = `Termine !`;
      const sc = document.getElementById('scoreContainer');
      sc.classList.remove('hidden');
      const pct = Math.round((score / questions.length) * 100);
      let msg = pct === 100 ? 'Parfait !' : pct >= 60 ? 'Bien joue !' : 'Continuez a reviser !';
      sc.innerHTML = `<div class="score">${score} / ${questions.length}</div>
        <div class="score-label">${msg} (${pct}%)</div>
        <button class="btn-restart" onclick="restart()">Recommencer</button>`;
    }

    function restart() {
      currentQuestion = 0; score = 0; answered = false;
      document.getElementById('scoreContainer').classList.add('hidden');
      document.getElementById('quizContainer').classList.remove('hidden');
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
