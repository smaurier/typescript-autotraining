<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 05 — Classes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; color: #ffffff; }
    .subtitle { text-align: center; color: #8892b0; margin-bottom: 2rem; font-size: 1rem; }
    .progress-bar-container { background: #0d1117; border-radius: 10px; height: 14px; margin-bottom: 2rem; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #0d6efd, #4dabf7); height: 100%; width: 0%; border-radius: 10px; transition: width 0.4s ease; }
    .progress-text { text-align: center; color: #8892b0; margin-bottom: 1rem; font-size: 0.9rem; }
    .card { background: #16213e; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .question-label { font-size: 0.85rem; color: #4dabf7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .question-text { font-size: 1.15rem; margin-bottom: 1.2rem; line-height: 1.5; color: #ffffff; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; overflow-x: auto; font-size: 0.95rem; }
    code { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; color: #c9d1d9; }
    .options { list-style: none; }
    .options li { margin-bottom: 0.5rem; }
    .options label { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; background: #0d1117; border: 2px solid #30363d; border-radius: 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s; font-size: 1rem; }
    .options label:hover { border-color: #4dabf7; background: #1c2a4a; }
    .options input[type="radio"] { accent-color: #0d6efd; width: 18px; height: 18px; flex-shrink: 0; }
    .btn { display: inline-block; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-primary { background: #0d6efd; color: #fff; }
    .btn-primary:hover { background: #3b82f6; }
    .btn-primary:disabled { background: #374151; cursor: not-allowed; }
    .btn-restart { background: #238636; color: #fff; margin-top: 1rem; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-restart:hover { background: #2ea043; }
    .feedback { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; display: none; }
    .feedback.correct { background: #0f5132; border: 1px solid #198754; color: #d1fae5; display: block; }
    .feedback.wrong { background: #842029; border: 1px solid #dc3545; color: #fdd; display: block; }
    .score-card { text-align: center; padding: 3rem 2rem; }
    .score-card .score { font-size: 3rem; font-weight: 700; color: #4dabf7; margin-bottom: 0.5rem; }
    .score-card .score-label { font-size: 1.2rem; color: #8892b0; margin-bottom: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz 05 — Classes</h1>
    <p class="subtitle">Heritage, abstract, visibilite, parameter properties</p>
    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    <p class="progress-text" id="progressText">Question 1 / 5</p>
    <div id="quizContainer"></div>
    <div id="scoreContainer" class="card score-card hidden"></div>
  </div>
  <script>
    const questions = [
      {
        label: "Question 1",
        text: "Que fait le raccourci « parameter properties » dans le constructeur d'une classe TypeScript ?",
        code: "// Avec parameter properties (raccourci)\nclass User {\n  constructor(\n    public name: string,\n    private age: number\n  ) {}\n}\n\n// Equivalent sans raccourci\nclass User {\n  public name: string;\n  private age: number;\n  constructor(name: string, age: number) {\n    this.name = name;\n    this.age = age;\n  }\n}",
        options: [
          "Il cree des getters et setters automatiquement",
          "Il declare la propriete, lui assigne la valeur du parametre et definit sa visibilite en une seule ligne",
          "Il rend les parametres du constructeur optionnels",
          "Il empeche la modification des proprietes apres la construction"
        ],
        answer: 1,
        explanation: "Les parameter properties sont un raccourci TypeScript : en ajoutant un modificateur de visibilite (public, private, protected) ou readonly devant un parametre du constructeur, TypeScript declare automatiquement la propriete de classe correspondante et lui assigne la valeur. Cela reduit considerablement le code repetitif (boilerplate)."
      },
      {
        label: "Question 2",
        text: "Quel est le role d'une classe abstraite (abstract) en TypeScript ?",
        code: "abstract class Shape {\n  abstract area(): number;\n\n  describe(): string {\n    return `Aire: ${this.area()}`;\n  }\n}\n\nclass Circle extends Shape {\n  constructor(private radius: number) { super(); }\n  area(): number { return Math.PI * this.radius ** 2; }\n}\n\n// const s = new Shape(); // Erreur !",
        options: [
          "Elle cree une interface avec des methodes par defaut",
          "Elle definit un contrat partiellement implemente que les sous-classes doivent completer, et ne peut pas etre instanciee directement",
          "Elle optimise les performances en mettant les methodes en cache",
          "Elle empeche toute extension par d'autres classes"
        ],
        answer: 1,
        explanation: "Une classe abstraite ne peut pas etre instanciee directement (new Shape() est interdit). Elle peut contenir des methodes abstraites (sans implementation) qui doivent etre implementees par les sous-classes, et des methodes concretes (avec implementation) qui sont heritees. C'est un outil puissant pour definir un squelette commun tout en forcant les sous-classes a fournir les details."
      },
      {
        label: "Question 3",
        text: "Quelle est la difference entre public, private et protected dans une classe TypeScript ?",
        code: "class Animal {\n  public name: string;      // accessible partout\n  private id: number;       // accessible ???\n  protected species: string; // accessible ???\n}",
        options: [
          "public : partout | private : nulle part | protected : sous-classes",
          "public : partout | private : classe elle-meme uniquement | protected : classe et sous-classes",
          "public : meme fichier | private : meme classe | protected : meme module",
          "public : lecture seule | private : lecture/ecriture | protected : ecriture seule"
        ],
        answer: 1,
        explanation: "public : accessible depuis n'importe ou (c'est le defaut). private : accessible uniquement dans la classe qui le declare. protected : accessible dans la classe qui le declare ET dans ses sous-classes. Attention : ces modificateurs sont des verifications a la compilation uniquement. Le JavaScript genere n'a pas de veritable encapsulation (sauf si vous utilisez les champs prives natifs avec #)."
      },
      {
        label: "Question 4",
        text: "Quelle est la difference entre implements et extends pour une classe ?",
        code: "interface Printable {\n  print(): void;\n}\n\nclass Base {\n  id = 0;\n}\n\nclass Doc extends Base implements Printable {\n  print() { console.log(`Doc #${this.id}`); }\n}",
        options: [
          "extends et implements sont synonymes pour les classes",
          "extends herite du code d'une classe parente ; implements exige que la classe respecte le contrat d'une interface",
          "extends est pour les interfaces, implements est pour les classes",
          "implements cree une copie de la classe, extends cree une reference"
        ],
        answer: 1,
        explanation: "extends cree un heritage de classe : la sous-classe recoit toutes les proprietes et methodes de la classe parente. implements indique que la classe s'engage a respecter le contrat d'une interface : elle doit fournir toutes les proprietes et methodes declarees, mais n'herite d'aucune implementation. Une classe peut extends une seule classe mais implements plusieurs interfaces."
      },
      {
        label: "Question 5",
        text: "A quoi sert le mot-cle override en TypeScript ?",
        code: "class Animal {\n  speak(): string {\n    return '...';\n  }\n}\n\nclass Dog extends Animal {\n  override speak(): string {\n    return 'Woof!';\n  }\n\n  override eat(): void {} // Erreur !\n}",
        options: [
          "Il empeche une methode d'etre surchargee par une sous-classe",
          "Il indique explicitement qu'une methode redefinit une methode parente, et TypeScript verifie que cette methode parente existe bien",
          "Il appelle automatiquement super() avant la methode",
          "Il rend la methode finale (non surchargeable)"
        ],
        answer: 1,
        explanation: "Le mot-cle override (active avec noImplicitOverride dans tsconfig) force le developpeur a indiquer explicitement quand une methode est censee redefinir une methode de la classe parente. Si la methode parente n'existe pas (faute de frappe, refactoring), TypeScript signale une erreur. Dans l'exemple, override eat() echoue car Animal n'a pas de methode eat(). C'est une securite precieuse lors du refactoring."
      }
    ];

    let currentQuestion = 0, score = 0, answered = false;

    function renderQuestion() {
      const q = questions[currentQuestion];
      const total = questions.length;
      document.getElementById('progressBar').style.width = ((currentQuestion / total) * 100) + '%';
      document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} / ${total}`;
      let html = `<div class="card">
        <p class="question-label">${q.label}</p>
        <p class="question-text">${q.text}</p>`;
      if (q.code) {
        html += `<pre><code>${q.code}</code></pre>`;
      }
      html += `<ul class="options">`;
      q.options.forEach((opt, i) => {
        html += `<li><label><input type="radio" name="q" value="${i}"> ${opt}</label></li>`;
      });
      html += `</ul>
        <button class="btn btn-primary" id="validateBtn" onclick="validate()" disabled>Valider</button>
        <div class="feedback" id="feedback"></div>
      </div>`;
      document.getElementById('quizContainer').innerHTML = html;
      document.querySelectorAll('input[name="q"]').forEach(r => {
        r.addEventListener('change', () => {
          document.getElementById('validateBtn').disabled = false;
        });
      });
      answered = false;
    }

    function validate() {
      if (answered) {
        currentQuestion++;
        if (currentQuestion < questions.length) {
          renderQuestion();
        } else {
          showScore();
        }
        return;
      }
      answered = true;
      const selected = document.querySelector('input[name="q"]:checked');
      if (!selected) return;
      const val = parseInt(selected.value);
      const q = questions[currentQuestion];
      const fb = document.getElementById('feedback');
      const btn = document.getElementById('validateBtn');
      document.querySelectorAll('input[name="q"]').forEach(r => r.disabled = true);
      if (val === q.answer) {
        score++;
        fb.className = 'feedback correct';
        fb.innerHTML = `<strong>Correct !</strong> ${q.explanation}`;
      } else {
        fb.className = 'feedback wrong';
        fb.innerHTML = `<strong>Incorrect.</strong> ${q.explanation}`;
      }
      btn.textContent = currentQuestion < questions.length - 1 ? 'Suivant' : 'Voir le score';
    }

    function showScore() {
      document.getElementById('quizContainer').classList.add('hidden');
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('progressText').textContent = `Termine !`;
      const sc = document.getElementById('scoreContainer');
      sc.classList.remove('hidden');
      const pct = Math.round((score / questions.length) * 100);
      let msg = pct === 100 ? 'Parfait !' : pct >= 60 ? 'Bien joue !' : 'Continuez a reviser !';
      sc.innerHTML = `<div class="score">${score} / ${questions.length}</div>
        <div class="score-label">${msg} (${pct}%)</div>
        <button class="btn-restart" onclick="restart()">Recommencer</button>`;
    }

    function restart() {
      currentQuestion = 0; score = 0; answered = false;
      document.getElementById('scoreContainer').classList.add('hidden');
      document.getElementById('quizContainer').classList.remove('hidden');
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
