<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 07 — Generics Avances</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; color: #ffffff; }
    .subtitle { text-align: center; color: #8892b0; margin-bottom: 2rem; font-size: 1rem; }
    .progress-bar-container { background: #0d1117; border-radius: 10px; height: 14px; margin-bottom: 2rem; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #0d6efd, #4dabf7); height: 100%; width: 0%; border-radius: 10px; transition: width 0.4s ease; }
    .progress-text { text-align: center; color: #8892b0; margin-bottom: 1rem; font-size: 0.9rem; }
    .card { background: #16213e; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .question-label { font-size: 0.85rem; color: #4dabf7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .question-text { font-size: 1.15rem; margin-bottom: 1.2rem; line-height: 1.5; color: #ffffff; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; overflow-x: auto; font-size: 0.95rem; }
    code { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; color: #c9d1d9; }
    .options { list-style: none; }
    .options li { margin-bottom: 0.5rem; }
    .options label { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; background: #0d1117; border: 2px solid #30363d; border-radius: 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s; font-size: 1rem; }
    .options label:hover { border-color: #4dabf7; background: #1c2a4a; }
    .options input[type="radio"] { accent-color: #0d6efd; width: 18px; height: 18px; flex-shrink: 0; }
    .btn { display: inline-block; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-primary { background: #0d6efd; color: #fff; }
    .btn-primary:hover { background: #3b82f6; }
    .btn-primary:disabled { background: #374151; cursor: not-allowed; }
    .btn-restart { background: #238636; color: #fff; margin-top: 1rem; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-restart:hover { background: #2ea043; }
    .feedback { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; display: none; }
    .feedback.correct { background: #0f5132; border: 1px solid #198754; color: #d1fae5; display: block; }
    .feedback.wrong { background: #842029; border: 1px solid #dc3545; color: #fdd; display: block; }
    .score-card { text-align: center; padding: 3rem 2rem; }
    .score-card .score { font-size: 3rem; font-weight: 700; color: #4dabf7; margin-bottom: 0.5rem; }
    .score-card .score-label { font-size: 1.2rem; color: #8892b0; margin-bottom: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz 07 — Generics Avances</h1>
    <p class="subtitle">Variadics, branded types, builder pattern</p>
    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    <p class="progress-text" id="progressText">Question 1 / 5</p>
    <div id="quizContainer"></div>
    <div id="scoreContainer" class="card score-card hidden"></div>
  </div>
  <script>
    const questions = [
      {
        label: "Question 1",
        text: "Qu'est-ce qu'un branded type (ou opaque type) et quel probleme resout-il ?",
        code: "type UserId = number &amp; { readonly __brand: unique symbol };\ntype OrderId = number &amp; { readonly __brand: unique symbol };\n\nfunction getUser(id: UserId) { /* ... */ }\n\nconst userId = 42 as UserId;\nconst orderId = 42 as OrderId;\n\ngetUser(userId);   // OK\ngetUser(orderId);  // Erreur ! OrderId n'est pas UserId",
        options: [
          "C'est un type qui cache sa definition pour les modules externes",
          "C'est un pattern qui rend deux types structurellement identiques incompatibles entre eux grace a une marque (brand) fictive",
          "C'est un type qui est encrypte a la compilation",
          "C'est un type generique avec une valeur par defaut"
        ],
        answer: 1,
        explanation: "Les branded types resolvent une limitation du typage structurel : deux types avec la meme structure (ex: UserId et OrderId, tous deux number) sont normalement interchangeables. En ajoutant une propriete fictive (brand) avec un unique symbol, on les rend structurellement differents. La marque n'existe qu'au niveau du type et n'a aucun impact a l'execution. Cela previent les confusions accidentelles entre identifiants."
      },
      {
        label: "Question 2",
        text: "Que permettent les variadic tuple types introduits en TypeScript 4.0 ?",
        code: "type Concat&lt;A extends unknown[], B extends unknown[]&gt; = [...A, ...B];\n\ntype Result = Concat&lt;[1, 2], [3, 4]&gt;;\n// Result = [1, 2, 3, 4]\n\nfunction concat&lt;A extends unknown[], B extends unknown[]&gt;(\n  a: [...A], b: [...B]\n): [...A, ...B] {\n  return [...a, ...b];\n}",
        options: [
          "Ils permettent de creer des tableaux de taille variable a l'execution",
          "Ils permettent de manipuler et combiner les types de tuples de maniere generique avec le spread (...) au niveau des types",
          "Ils remplacent les rest parameters dans les fonctions",
          "Ils convertissent les tableaux en objets"
        ],
        answer: 1,
        explanation: "Les variadic tuple types permettent d'utiliser l'operateur spread (...) au niveau des types pour manipuler des tuples generiquement. On peut concatener, decomposer et transformer des types de tuples de maniere precise. C'est particulierement utile pour typer des fonctions comme concat, pipe, curry, ou tout pattern qui combine des listes de types."
      },
      {
        label: "Question 3",
        text: "Que fait le mot-cle infer dans un type conditionnel ?",
        code: "type ReturnType&lt;T&gt; = T extends (...args: any[]) =&gt; infer R ? R : never;\n\ntype A = ReturnType&lt;() =&gt; string&gt;;        // string\ntype B = ReturnType&lt;(x: number) =&gt; boolean&gt;; // boolean\ntype C = ReturnType&lt;number&gt;;                 // never",
        options: [
          "Il force TypeScript a inferer le type au lieu de l'expliciter",
          "Il declare une variable de type locale dans un type conditionnel, que TypeScript deduit du pattern matching",
          "Il cree un type a partir d'une valeur runtime",
          "Il desactive la verification de types pour la variable inferee"
        ],
        answer: 1,
        explanation: "Le mot-cle infer ne peut etre utilise que dans la branche extends d'un type conditionnel. Il declare une variable de type (ici R) que TypeScript deduit automatiquement en faisant du pattern matching sur le type teste. Si le pattern correspond, R capture le type deduit et peut etre utilise dans la branche vraie. C'est le mecanisme derriere les utility types comme ReturnType, Parameters, etc."
      },
      {
        label: "Question 4",
        text: "Comment le builder pattern tire-t-il parti des generics en TypeScript ?",
        code: "class QueryBuilder&lt;Selected extends string = never&gt; {\n  select&lt;Col extends string&gt;(col: Col)\n    : QueryBuilder&lt;Selected | Col&gt; {\n    // ... ajouter la colonne\n    return this as any;\n  }\n\n  execute(): Record&lt;Selected, unknown&gt; {\n    // ... executer la requete\n    return {} as any;\n  }\n}\n\nconst result = new QueryBuilder()\n  .select('name')\n  .select('age')\n  .execute();\n// result: Record&lt;'name' | 'age', unknown&gt;",
        options: [
          "Les generics permettent d'enchainer les appels sans perdre l'information sur les etapes precedentes",
          "Les generics rendent le builder plus rapide a l'execution",
          "Les generics remplacent le pattern builder par un pattern factory",
          "Les generics empechent les appels en chaine"
        ],
        answer: 0,
        explanation: "Le builder pattern combine avec les generics permet a chaque appel de methode d'enrichir le type. Ici, chaque appel a select() ajoute le nom de colonne au type generique Selected. A la fin, execute() retourne un type qui connait exactement les colonnes selectionnees. Le type se construit au fur et a mesure de la chaine d'appels, offrant une autocompletion et une verification de type parfaites."
      },
      {
        label: "Question 5",
        text: "Qu'est-ce que la distributivite dans les types conditionnels generiques ?",
        code: "type ToArray&lt;T&gt; = T extends unknown ? T[] : never;\n\ntype A = ToArray&lt;string | number&gt;;\n// Resultat : string[] | number[]\n// Et NON : (string | number)[]",
        options: [
          "TypeScript distribue l'operation a chaque element de l'objet",
          "Quand T est une union, le type conditionnel est applique a chaque membre de l'union individuellement, puis les resultats sont reunis",
          "TypeScript divise le type en sous-types plus petits pour optimiser",
          "La distributivite ne concerne que les tableaux"
        ],
        answer: 1,
        explanation: "La distributivite est un comportement automatique des types conditionnels : quand le parametre de type T recoit une union (string | number), le type conditionnel est evalue separement pour chaque membre de l'union. Les resultats sont ensuite recombines en une union. Ainsi, ToArray&lt;string | number&gt; donne string[] | number[] et non (string | number)[]. Pour eviter ce comportement, on peut envelopper T dans un tuple : [T] extends [unknown]."
      }
    ];

    let currentQuestion = 0, score = 0, answered = false;

    function renderQuestion() {
      const q = questions[currentQuestion];
      const total = questions.length;
      document.getElementById('progressBar').style.width = ((currentQuestion / total) * 100) + '%';
      document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} / ${total}`;
      let html = `<div class="card">
        <p class="question-label">${q.label}</p>
        <p class="question-text">${q.text}</p>`;
      if (q.code) {
        html += `<pre><code>${q.code}</code></pre>`;
      }
      html += `<ul class="options">`;
      q.options.forEach((opt, i) => {
        html += `<li><label><input type="radio" name="q" value="${i}"> ${opt}</label></li>`;
      });
      html += `</ul>
        <button class="btn btn-primary" id="validateBtn" onclick="validate()" disabled>Valider</button>
        <div class="feedback" id="feedback"></div>
      </div>`;
      document.getElementById('quizContainer').innerHTML = html;
      document.querySelectorAll('input[name="q"]').forEach(r => {
        r.addEventListener('change', () => {
          document.getElementById('validateBtn').disabled = false;
        });
      });
      answered = false;
    }

    function validate() {
      if (answered) {
        currentQuestion++;
        if (currentQuestion < questions.length) {
          renderQuestion();
        } else {
          showScore();
        }
        return;
      }
      answered = true;
      const selected = document.querySelector('input[name="q"]:checked');
      if (!selected) return;
      const val = parseInt(selected.value);
      const q = questions[currentQuestion];
      const fb = document.getElementById('feedback');
      const btn = document.getElementById('validateBtn');
      document.querySelectorAll('input[name="q"]').forEach(r => r.disabled = true);
      if (val === q.answer) {
        score++;
        fb.className = 'feedback correct';
        fb.innerHTML = `<strong>Correct !</strong> ${q.explanation}`;
      } else {
        fb.className = 'feedback wrong';
        fb.innerHTML = `<strong>Incorrect.</strong> ${q.explanation}`;
      }
      btn.textContent = currentQuestion < questions.length - 1 ? 'Suivant' : 'Voir le score';
    }

    function showScore() {
      document.getElementById('quizContainer').classList.add('hidden');
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('progressText').textContent = `Termine !`;
      const sc = document.getElementById('scoreContainer');
      sc.classList.remove('hidden');
      const pct = Math.round((score / questions.length) * 100);
      let msg = pct === 100 ? 'Parfait !' : pct >= 60 ? 'Bien joue !' : 'Continuez a reviser !';
      sc.innerHTML = `<div class="score">${score} / ${questions.length}</div>
        <div class="score-label">${msg} (${pct}%)</div>
        <button class="btn-restart" onclick="restart()">Recommencer</button>`;
    }

    function restart() {
      currentQuestion = 0; score = 0; answered = false;
      document.getElementById('scoreContainer').classList.add('hidden');
      document.getElementById('quizContainer').classList.remove('hidden');
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
