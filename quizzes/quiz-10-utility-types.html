<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 10 — Utility Types</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; color: #ffffff; }
    .subtitle { text-align: center; color: #8892b0; margin-bottom: 2rem; font-size: 1rem; }
    .progress-bar-container { background: #0d1117; border-radius: 10px; height: 14px; margin-bottom: 2rem; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #0d6efd, #4dabf7); height: 100%; width: 0%; border-radius: 10px; transition: width 0.4s ease; }
    .progress-text { text-align: center; color: #8892b0; margin-bottom: 1rem; font-size: 0.9rem; }
    .card { background: #16213e; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .question-label { font-size: 0.85rem; color: #4dabf7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .question-text { font-size: 1.15rem; margin-bottom: 1.2rem; line-height: 1.5; color: #ffffff; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; overflow-x: auto; font-size: 0.95rem; }
    code { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; color: #c9d1d9; }
    .options { list-style: none; }
    .options li { margin-bottom: 0.5rem; }
    .options label { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; background: #0d1117; border: 2px solid #30363d; border-radius: 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s; font-size: 1rem; }
    .options label:hover { border-color: #4dabf7; background: #1c2a4a; }
    .options input[type="radio"] { accent-color: #0d6efd; width: 18px; height: 18px; flex-shrink: 0; }
    .btn { display: inline-block; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-primary { background: #0d6efd; color: #fff; }
    .btn-primary:hover { background: #3b82f6; }
    .btn-primary:disabled { background: #374151; cursor: not-allowed; }
    .btn-restart { background: #238636; color: #fff; margin-top: 1rem; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-restart:hover { background: #2ea043; }
    .feedback { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; display: none; }
    .feedback.correct { background: #0f5132; border: 1px solid #198754; color: #d1fae5; display: block; }
    .feedback.wrong { background: #842029; border: 1px solid #dc3545; color: #fdd; display: block; }
    .score-card { text-align: center; padding: 3rem 2rem; }
    .score-card .score { font-size: 3rem; font-weight: 700; color: #4dabf7; margin-bottom: 0.5rem; }
    .score-card .score-label { font-size: 1.2rem; color: #8892b0; margin-bottom: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz 10 — Utility Types</h1>
    <p class="subtitle">Partial, Pick, Omit, Record, ReturnType</p>
    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    <p class="progress-text" id="progressText">Question 1 / 5</p>
    <div id="quizContainer"></div>
    <div id="scoreContainer" class="card score-card hidden"></div>
  </div>
  <script>
    const questions = [
      {
        label: "Question 1",
        text: "Quel est le comportement de <code>Partial&lt;T&gt;</code> en TypeScript ?",
        code: "interface User {\n  name: string;\n  age: number;\n  email: string;\n}\n\ntype PartialUser = Partial&lt;User&gt;;",
        options: [
          "Il rend toutes les proprietes obligatoires",
          "Il rend toutes les proprietes optionnelles",
          "Il supprime toutes les proprietes",
          "Il rend toutes les proprietes en lecture seule"
        ],
        answer: 1,
        explanation: "<code>Partial&lt;T&gt;</code> transforme toutes les proprietes de <code>T</code> en proprietes optionnelles en ajoutant <code>?</code> a chaque cle. Ici, <code>PartialUser</code> equivaut a <code>{ name?: string; age?: number; email?: string; }</code>."
      },
      {
        label: "Question 2",
        text: "Quelle est la difference entre <code>Pick</code> et <code>Omit</code> ?",
        code: "interface Product {\n  id: number;\n  name: string;\n  price: number;\n  description: string;\n}\n\ntype A = Pick&lt;Product, 'id' | 'name'&gt;;\ntype B = Omit&lt;Product, 'id' | 'name'&gt;;",
        options: [
          "Pick supprime les cles specifiees, Omit les conserve",
          "Pick conserve les cles specifiees, Omit les supprime",
          "Les deux font la meme chose",
          "Pick fonctionne avec les unions, Omit avec les intersections"
        ],
        answer: 1,
        explanation: "<code>Pick&lt;T, K&gt;</code> cree un type en ne gardant que les cles <code>K</code> de <code>T</code>. <code>Omit&lt;T, K&gt;</code> cree un type en supprimant les cles <code>K</code> de <code>T</code>. Ici, <code>A = { id: number; name: string; }</code> et <code>B = { price: number; description: string; }</code>."
      },
      {
        label: "Question 3",
        text: "Que produit le type suivant utilisant <code>Record</code> ?",
        code: "type Status = 'active' | 'inactive' | 'pending';\ntype StatusInfo = Record&lt;Status, { label: string; color: string }&gt;;",
        options: [
          "Un type union de trois objets differents",
          "Un objet avec trois proprietes obligatoires 'active', 'inactive', 'pending', chacune de type { label: string; color: string }",
          "Un tableau de trois elements",
          "Un type generique parametre par Status"
        ],
        answer: 1,
        explanation: "<code>Record&lt;K, V&gt;</code> cree un type objet dont les cles sont de type <code>K</code> et les valeurs de type <code>V</code>. Ici, l'objet doit avoir exactement les trois proprietes <code>active</code>, <code>inactive</code> et <code>pending</code>, chacune contenant <code>{ label: string; color: string }</code>."
      },
      {
        label: "Question 4",
        text: "Quel type est infere par <code>ReturnType</code> dans cet exemple ?",
        code: "function createUser(name: string, age: number) {\n  return { name, age, createdAt: new Date() };\n}\n\ntype UserResult = ReturnType&lt;typeof createUser&gt;;",
        options: [
          "{ name: string; age: number }",
          "{ name: string; age: number; createdAt: Date }",
          "void",
          "typeof createUser"
        ],
        answer: 1,
        explanation: "<code>ReturnType&lt;T&gt;</code> extrait le type de retour d'une fonction. Ici, <code>createUser</code> retourne un objet avec <code>name</code> (string), <code>age</code> (number) et <code>createdAt</code> (Date). Notez l'utilisation de <code>typeof</code> pour obtenir le type de la fonction."
      },
      {
        label: "Question 5",
        text: "Quel est le resultat de la combinaison de ces utility types ?",
        code: "interface Config {\n  host: string;\n  port: number;\n  debug: boolean;\n  logLevel: string;\n}\n\ntype SafeConfig = Readonly&lt;Required&lt;Pick&lt;Config, 'host' | 'port'&gt;&gt;&gt;;",
        options: [
          "{ host: string; port: number; debug: boolean; logLevel: string }",
          "{ readonly host: string; readonly port: number }",
          "{ host?: string; port?: number }",
          "{ readonly host?: string; readonly port?: number }"
        ],
        answer: 1,
        explanation: "Les utility types se composent de l'interieur vers l'exterieur : <code>Pick</code> selectionne <code>host</code> et <code>port</code>, <code>Required</code> les rend obligatoires (ici ils le sont deja), puis <code>Readonly</code> les rend en lecture seule. Le resultat est <code>{ readonly host: string; readonly port: number }</code>."
      },
      {
        label: "Question 6",
        text: "Quelle difference y a-t-il entre <code>Exclude</code> et <code>Extract</code> ?",
        code: "type A = Exclude&lt;'a' | 'b' | 'c', 'a' | 'b'&gt;;\n// A = 'c'\n\ntype B = Extract&lt;'a' | 'b' | 'c', 'a' | 'b'&gt;;\n// B = 'a' | 'b'",
        options: [
          "Exclude garde les types en commun, Extract retire les types en commun",
          "Exclude retire les types assignables au second parametre, Extract ne garde que ceux qui le sont",
          "Les deux font la meme chose mais avec une syntaxe differente",
          "Exclude fonctionne sur les objets, Extract sur les unions"
        ],
        answer: 1,
        explanation: "<code>Exclude&lt;T, U&gt;</code> retire de <code>T</code> tous les membres assignables a <code>U</code>. <code>Extract&lt;T, U&gt;</code> ne garde que les membres de <code>T</code> assignables a <code>U</code>. Ce sont des operateurs complementaires : <code>Exclude</code> filtre en soustrayant, <code>Extract</code> filtre en intersectant. Ils sont implementes avec des conditional types distributifs."
      },
      {
        label: "Question 7",
        text: "Comment <code>NonNullable</code> et <code>Parameters</code> sont-ils utiles ?",
        code: "type MaybeString = string | null | undefined;\ntype DefinitelyString = NonNullable&lt;MaybeString&gt;;\n// DefinitelyString = string\n\nfunction greet(name: string, age: number, verbose?: boolean) {}\ntype GreetParams = Parameters&lt;typeof greet&gt;;\n// GreetParams = [name: string, age: number, verbose?: boolean]",
        options: [
          "NonNullable convertit null en '', Parameters retourne le nombre de parametres",
          "NonNullable retire null et undefined d'un type union, Parameters extrait les types de parametres d'un type fonction sous forme de tuple",
          "Les deux ne fonctionnent qu'avec des types generiques",
          "NonNullable s'applique aux objets, Parameters aux classes"
        ],
        answer: 1,
        explanation: "<code>NonNullable&lt;T&gt;</code> supprime <code>null</code> et <code>undefined</code> de l'union <code>T</code>. C'est le complementaire de <code>T | null | undefined</code>. <code>Parameters&lt;T&gt;</code> extrait les types de parametres d'un type fonction et les retourne sous forme de tuple. Il est tres utile pour creer des variantes d'une fonction ou pour tester les types d'une API."
      }
    ];
    let currentQuestion = 0, score = 0, answered = false;
    function renderQuestion() {
      if (currentQuestion >= questions.length) { showScore(); return; }
      const q = questions[currentQuestion];
      const pct = (currentQuestion / questions.length) * 100;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressText').textContent = 'Question ' + (currentQuestion + 1) + ' / ' + questions.length;
      let html = '<div class="card">';
      html += '<div class="question-label">' + q.label + '</div>';
      html += '<div class="question-text">' + q.text + '</div>';
      if (q.code) html += '<pre><code>' + q.code + '</code></pre>';
      html += '<ul class="options">';
      q.options.forEach(function(opt, i) {
        html += '<li><label><input type="radio" name="q" value="' + i + '"> ' + opt + '</label></li>';
      });
      html += '</ul>';
      html += '<button class="btn btn-primary" id="validateBtn" onclick="validate()" disabled>Valider</button>';
      html += '<div class="feedback" id="feedback"></div>';
      html += '</div>';
      document.getElementById('quizContainer').innerHTML = html;
      document.getElementById('scoreContainer').classList.add('hidden');
      answered = false;
      document.querySelectorAll('input[name="q"]').forEach(function(input) {
        input.addEventListener('change', function() { document.getElementById('validateBtn').disabled = false; });
      });
    }
    function validate() {
      if (answered) return;
      answered = true;
      const selected = document.querySelector('input[name="q"]:checked');
      if (!selected) return;
      const val = parseInt(selected.value);
      const q = questions[currentQuestion];
      const fb = document.getElementById('feedback');
      if (val === q.answer) {
        score++;
        fb.className = 'feedback correct';
        fb.innerHTML = '<strong>Correct !</strong> ' + q.explanation;
      } else {
        fb.className = 'feedback wrong';
        fb.innerHTML = '<strong>Incorrect.</strong> ' + q.explanation;
      }
      document.getElementById('validateBtn').disabled = true;
      setTimeout(function() { currentQuestion++; renderQuestion(); }, 3000);
    }
    function showScore() {
      document.getElementById('quizContainer').innerHTML = '';
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('progressText').textContent = 'Terminé !';
      const sc = document.getElementById('scoreContainer');
      sc.classList.remove('hidden');
      const pct = Math.round((score / questions.length) * 100);
      let msg = pct >= 80 ? 'Excellent travail !' : pct >= 60 ? 'Bon travail, quelques points à revoir.' : 'Continuez à étudier, vous progresserez !';
      sc.innerHTML = '<div class="score">' + score + ' / ' + questions.length + '</div><div class="score-label">' + pct + '% — ' + msg + '</div><button class="btn-restart" onclick="restart()">Recommencer</button>';
    }
    function restart() { currentQuestion = 0; score = 0; answered = false; renderQuestion(); }
    renderQuestion();
  </script>
</body>
</html>
