<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 13 — Type-Level Programming</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; color: #ffffff; }
    .subtitle { text-align: center; color: #8892b0; margin-bottom: 2rem; font-size: 1rem; }
    .progress-bar-container { background: #0d1117; border-radius: 10px; height: 14px; margin-bottom: 2rem; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #0d6efd, #4dabf7); height: 100%; width: 0%; border-radius: 10px; transition: width 0.4s ease; }
    .progress-text { text-align: center; color: #8892b0; margin-bottom: 1rem; font-size: 0.9rem; }
    .card { background: #16213e; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .question-label { font-size: 0.85rem; color: #4dabf7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .question-text { font-size: 1.15rem; margin-bottom: 1.2rem; line-height: 1.5; color: #ffffff; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; overflow-x: auto; font-size: 0.95rem; }
    code { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; color: #c9d1d9; }
    .options { list-style: none; }
    .options li { margin-bottom: 0.5rem; }
    .options label { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; background: #0d1117; border: 2px solid #30363d; border-radius: 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s; font-size: 1rem; }
    .options label:hover { border-color: #4dabf7; background: #1c2a4a; }
    .options input[type="radio"] { accent-color: #0d6efd; width: 18px; height: 18px; flex-shrink: 0; }
    .btn { display: inline-block; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-primary { background: #0d6efd; color: #fff; }
    .btn-primary:hover { background: #3b82f6; }
    .btn-primary:disabled { background: #374151; cursor: not-allowed; }
    .btn-restart { background: #238636; color: #fff; margin-top: 1rem; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-restart:hover { background: #2ea043; }
    .feedback { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; display: none; }
    .feedback.correct { background: #0f5132; border: 1px solid #198754; color: #d1fae5; display: block; }
    .feedback.wrong { background: #842029; border: 1px solid #dc3545; color: #fdd; display: block; }
    .score-card { text-align: center; padding: 3rem 2rem; }
    .score-card .score { font-size: 3rem; font-weight: 700; color: #4dabf7; margin-bottom: 0.5rem; }
    .score-card .score-label { font-size: 1.2rem; color: #8892b0; margin-bottom: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz 13 — Type-Level Programming</h1>
    <p class="subtitle">Types recursifs, arithmetique, parsing</p>
    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    <p class="progress-text" id="progressText">Question 1 / 5</p>
    <div id="quizContainer"></div>
    <div id="scoreContainer" class="card score-card hidden"></div>
  </div>
  <script>
    const questions = [
      {
        label: "Question 1",
        text: "Que vaut le type <code>Unwrap&lt;Promise&lt;Promise&lt;string&gt;&gt;&gt;</code> avec ce type recursif ?",
        code: "type Unwrap&lt;T&gt; = T extends Promise&lt;infer U&gt; ? Unwrap&lt;U&gt; : T;\n\ntype A = Unwrap&lt;string&gt;;\ntype B = Unwrap&lt;Promise&lt;number&gt;&gt;;\ntype C = Unwrap&lt;Promise&lt;Promise&lt;string&gt;&gt;&gt;;",
        options: [
          "A = string, B = Promise&lt;number&gt;, C = Promise&lt;string&gt;",
          "A = string, B = number, C = string",
          "A = never, B = number, C = string",
          "A = string, B = number, C = Promise&lt;string&gt;"
        ],
        answer: 1,
        explanation: "<code>Unwrap</code> est un type recursif : si <code>T</code> est un <code>Promise&lt;U&gt;</code>, il desemballe <code>U</code> et se rappelle. <code>A = string</code> car string n'est pas un Promise. <code>B = number</code> car <code>Promise&lt;number&gt;</code> est desemballe une fois. <code>C = string</code> car <code>Promise&lt;Promise&lt;string&gt;&gt;</code> est desemballe deux fois. C'est le meme principe que le type standard <code>Awaited&lt;T&gt;</code>."
      },
      {
        label: "Question 2",
        text: "Comment fonctionne l'optimisation tail-call pour les types recursifs en TypeScript ?",
        code: "// Sans tail-call (profondeur limitee) :\ntype NaiveLength&lt;T extends any[]&gt; =\n  T extends [any, ...infer Rest]\n    ? 1 + NaiveLength&lt;Rest&gt;  // pas valide en types !\n    : 0;\n\n// Avec accumulation (tail-call optimise) :\ntype Length&lt;T extends any[], Acc extends any[] = []&gt; =\n  T extends [any, ...infer Rest]\n    ? Length&lt;Rest, [...Acc, any]&gt;\n    : Acc['length'];",
        options: [
          "TypeScript optimise automatiquement tous les types recursifs",
          "Il faut utiliser un parametre accumulateur pour que la recursion soit en position terminale",
          "L'optimisation tail-call n'existe pas en TypeScript",
          "Il suffit d'ajouter le mot-cle 'tail' devant le type"
        ],
        answer: 1,
        explanation: "TypeScript 4.5+ supporte l'optimisation tail-call pour les conditional types. Pour en beneficier, le type recursif doit etre en <strong>position terminale</strong> (le resultat de la branche recursive est directement retourne). On utilise souvent un parametre accumulateur (tuple) pour atteindre cela."
      },
      {
        label: "Question 3",
        text: "Comment representer l'addition de deux nombres naturels au niveau des types ?",
        code: "type BuildTuple&lt;N extends number, T extends any[] = []&gt; =\n  T['length'] extends N ? T : BuildTuple&lt;N, [...T, any]&gt;;\n\ntype Add&lt;A extends number, B extends number&gt; =\n  [...BuildTuple&lt;A&gt;, ...BuildTuple&lt;B&gt;]['length'];\n\ntype Result = Add&lt;3, 4&gt;;",
        options: [
          "Result = number",
          "Result = 7",
          "Result = '7'",
          "Result = never"
        ],
        answer: 1,
        explanation: "L'arithmetique au niveau des types utilise la longueur des tuples. <code>BuildTuple&lt;3&gt;</code> cree <code>[any, any, any]</code>. En concatenant deux tuples avec le spread <code>[...A, ...B]</code>, on obtient un tuple de longueur 7, et <code>['length']</code> retourne le literal <code>7</code>."
      },
      {
        label: "Question 4",
        text: "Comment parser une chaine de caracteres au niveau des types ?",
        code: "type Split&lt;S extends string, D extends string&gt; =\n  S extends `${infer Head}${D}${infer Tail}`\n    ? [Head, ...Split&lt;Tail, D&gt;]\n    : [S];\n\ntype Result = Split&lt;'a.b.c', '.'&gt;;",
        options: [
          "Result = 'a.b.c'",
          "Result = ['a', 'b', 'c']",
          "Result = ['a.b.c']",
          "Result = string[]"
        ],
        answer: 1,
        explanation: "Les template literal types combines avec <code>infer</code> permettent de parser des chaines. Ici, <code>Split</code> decompose recursivement la chaine au niveau du delimiteur <code>'.'</code>. A chaque etape, <code>Head</code> capture le texte avant le premier <code>'.'</code> et <code>Tail</code> le reste."
      },
      {
        label: "Question 5",
        text: "Que fait ce type recursif conditionnel ?",
        code: "type Flatten&lt;T&gt; =\n  T extends Array&lt;infer U&gt;\n    ? Flatten&lt;U&gt;\n    : T;\n\ntype A = Flatten&lt;number[][][]&gt;;\ntype B = Flatten&lt;string&gt;;",
        options: [
          "A = number[][][], B = string",
          "A = number[], B = string",
          "A = number, B = string",
          "A = never, B = never"
        ],
        answer: 2,
        explanation: "<code>Flatten</code> desemballe recursivement les tableaux jusqu'a atteindre un type qui n'est pas un tableau. <code>number[][][]</code> devient <code>number[][]</code>, puis <code>number[]</code>, puis <code>number</code>. <code>string</code> n'est pas un tableau, donc il reste <code>string</code>."
      },
      {
        label: "Question 6",
        text: "Quelle est la difference entre un type recursif sur les valeurs et un type recursif sur les cles ?",
        code: "// Recursif sur les valeurs (en profondeur) :\ntype DeepReadonly&lt;T&gt; = {\n  readonly [K in keyof T]: T[K] extends object\n    ? DeepReadonly&lt;T[K]&gt;\n    : T[K];\n};\n\n// Recursif pour generer les chemins :\ntype Paths&lt;T&gt; = T extends object\n  ? { [K in keyof T]: K extends string\n      ? K | `${K}.${Paths&lt;T[K]&gt;}`\n      : never }[keyof T]\n  : never;",
        options: [
          "Les deux sont identiques, la distinction n'existe pas",
          "La recursion sur les valeurs transforme chaque valeur imbriquee. La recursion sur les cles genere de nouvelles cles/chemins a partir de la structure.",
          "Seule la recursion sur les valeurs est supportee en TypeScript",
          "La recursion sur les cles necessite le flag recursiveTypes actif"
        ],
        answer: 1,
        explanation: "<code>DeepReadonly</code> est recursif sur les <strong>valeurs</strong> : pour chaque propriete, si sa valeur est un objet, on applique recursivite. <code>Paths</code> est recursif sur les <strong>cles</strong> : il genere toutes les chaines de chemin possibles (<code>'user'</code>, <code>'user.name'</code>, <code>'user.address.city'</code>...). Cette distinction structure/forme vs chemins/contenus est fondamentale dans la programmation de types avancee."
      }
    ];
    let currentQuestion = 0, score = 0, answered = false;
    function renderQuestion() {
      if (currentQuestion >= questions.length) { showScore(); return; }
      const q = questions[currentQuestion];
      const pct = (currentQuestion / questions.length) * 100;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressText').textContent = 'Question ' + (currentQuestion + 1) + ' / ' + questions.length;
      let html = '<div class="card">';
      html += '<div class="question-label">' + q.label + '</div>';
      html += '<div class="question-text">' + q.text + '</div>';
      if (q.code) html += '<pre><code>' + q.code + '</code></pre>';
      html += '<ul class="options">';
      q.options.forEach(function(opt, i) {
        html += '<li><label><input type="radio" name="q" value="' + i + '"> ' + opt + '</label></li>';
      });
      html += '</ul>';
      html += '<button class="btn btn-primary" id="validateBtn" onclick="validate()" disabled>Valider</button>';
      html += '<div class="feedback" id="feedback"></div>';
      html += '</div>';
      document.getElementById('quizContainer').innerHTML = html;
      document.getElementById('scoreContainer').classList.add('hidden');
      answered = false;
      document.querySelectorAll('input[name="q"]').forEach(function(input) {
        input.addEventListener('change', function() { document.getElementById('validateBtn').disabled = false; });
      });
    }
    function validate() {
      if (answered) return;
      answered = true;
      const selected = document.querySelector('input[name="q"]:checked');
      if (!selected) return;
      const val = parseInt(selected.value);
      const q = questions[currentQuestion];
      const fb = document.getElementById('feedback');
      if (val === q.answer) {
        score++;
        fb.className = 'feedback correct';
        fb.innerHTML = '<strong>Correct !</strong> ' + q.explanation;
      } else {
        fb.className = 'feedback wrong';
        fb.innerHTML = '<strong>Incorrect.</strong> ' + q.explanation;
      }
      document.getElementById('validateBtn').disabled = true;
      setTimeout(function() { currentQuestion++; renderQuestion(); }, 3000);
    }
    function showScore() {
      document.getElementById('quizContainer').innerHTML = '';
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('progressText').textContent = 'Terminé !';
      const sc = document.getElementById('scoreContainer');
      sc.classList.remove('hidden');
      const pct = Math.round((score / questions.length) * 100);
      let msg = pct >= 80 ? 'Excellent travail !' : pct >= 60 ? 'Bon travail, quelques points à revoir.' : 'Continuez à étudier, vous progresserez !';
      sc.innerHTML = '<div class="score">' + score + ' / ' + questions.length + '</div><div class="score-label">' + pct + '% — ' + msg + '</div><button class="btn-restart" onclick="restart()">Recommencer</button>';
    }
    function restart() { currentQuestion = 0; score = 0; answered = false; renderQuestion(); }
    renderQuestion();
  </script>
</body>
</html>
