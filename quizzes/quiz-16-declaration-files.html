<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 16 — Declaration Files</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; color: #ffffff; }
    .subtitle { text-align: center; color: #8892b0; margin-bottom: 2rem; font-size: 1rem; }
    .progress-bar-container { background: #0d1117; border-radius: 10px; height: 14px; margin-bottom: 2rem; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #0d6efd, #4dabf7); height: 100%; width: 0%; border-radius: 10px; transition: width 0.4s ease; }
    .progress-text { text-align: center; color: #8892b0; margin-bottom: 1rem; font-size: 0.9rem; }
    .card { background: #16213e; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .question-label { font-size: 0.85rem; color: #4dabf7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .question-text { font-size: 1.15rem; margin-bottom: 1.2rem; line-height: 1.5; color: #ffffff; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; overflow-x: auto; font-size: 0.95rem; }
    code { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; color: #c9d1d9; }
    .options { list-style: none; }
    .options li { margin-bottom: 0.5rem; }
    .options label { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; background: #0d1117; border: 2px solid #30363d; border-radius: 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s; font-size: 1rem; }
    .options label:hover { border-color: #4dabf7; background: #1c2a4a; }
    .options input[type="radio"] { accent-color: #0d6efd; width: 18px; height: 18px; flex-shrink: 0; }
    .btn { display: inline-block; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-primary { background: #0d6efd; color: #fff; }
    .btn-primary:hover { background: #3b82f6; }
    .btn-primary:disabled { background: #374151; cursor: not-allowed; }
    .btn-restart { background: #238636; color: #fff; margin-top: 1rem; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-restart:hover { background: #2ea043; }
    .feedback { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; display: none; }
    .feedback.correct { background: #0f5132; border: 1px solid #198754; color: #d1fae5; display: block; }
    .feedback.wrong { background: #842029; border: 1px solid #dc3545; color: #fdd; display: block; }
    .score-card { text-align: center; padding: 3rem 2rem; }
    .score-card .score { font-size: 3rem; font-weight: 700; color: #4dabf7; margin-bottom: 0.5rem; }
    .score-card .score-label { font-size: 1.2rem; color: #8892b0; margin-bottom: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz 16 — Declaration Files</h1>
    <p class="subtitle">.d.ts, module augmentation, DefinitelyTyped</p>
    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    <p class="progress-text" id="progressText">Question 1 / 5</p>
    <div id="quizContainer"></div>
    <div id="scoreContainer" class="card score-card hidden"></div>
  </div>
  <script>
    const questions = [
      {
        label: "Question 1",
        text: "Quel est le role d'un fichier <code>.d.ts</code> en TypeScript ?",
        code: "// math-lib.d.ts\ndeclare module 'math-lib' {\n  export function add(a: number, b: number): number;\n  export function multiply(a: number, b: number): number;\n}",
        options: [
          "Il contient du code executable optimise",
          "Il fournit les informations de type sans code d'implementation",
          "Il remplace le fichier .ts correspondant",
          "Il est utilise uniquement pour les tests"
        ],
        answer: 1,
        explanation: "Un fichier <code>.d.ts</code> (declaration file) fournit les <strong>informations de type</strong> sans aucun code d'implementation. Il permet a TypeScript de connaitre la forme d'un module JavaScript pur, d'une bibliotheque tierce, ou de code genere, sans avoir besoin du code source."
      },
      {
        label: "Question 2",
        text: "Que signifie le mot-cle <code>declare</code> dans un fichier de declaration ?",
        code: "declare const API_URL: string;\ndeclare function fetchData(url: string): Promise&lt;any&gt;;\ndeclare class Logger {\n  log(message: string): void;\n}",
        options: [
          "Il declare une variable locale",
          "Il indique que l'entite existe a l'execution mais sa definition est fournie ailleurs",
          "Il cree une nouvelle variable globale",
          "Il est synonyme de 'export'"
        ],
        answer: 1,
        explanation: "<code>declare</code> informe TypeScript qu'une entite <strong>existe a l'execution</strong> mais que son implementation est fournie ailleurs (par un script externe, une variable globale du navigateur, etc.). Il ne genere aucun code JavaScript : c'est purement une annotation de type."
      },
      {
        label: "Question 3",
        text: "Comment augmenter un module existant pour y ajouter de nouvelles declarations ?",
        code: "// augment-express.d.ts\nimport 'express';\n\ndeclare module 'express' {\n  interface Request {\n    userId?: string;\n    roles?: string[];\n  }\n}",
        options: [
          "En creant un nouveau module avec le meme nom",
          "En utilisant declare module avec le nom exact du module pour fusionner les declarations",
          "En modifiant directement le fichier .d.ts de la bibliotheque dans node_modules",
          "En utilisant namespace augmentation uniquement"
        ],
        answer: 1,
        explanation: "La <strong>module augmentation</strong> utilise <code>declare module 'nom-du-module'</code> dans un fichier qui contient au moins un import/export (pour etre considere comme un module). Les nouvelles declarations sont <strong>fusionnees</strong> avec les declarations existantes du module. Ici, on ajoute <code>userId</code> et <code>roles</code> a l'interface <code>Request</code> d'Express."
      },
      {
        label: "Question 4",
        text: "Quel est le role de DefinitelyTyped et comment installe-t-on ses types ?",
        code: "// Pour une bibliotheque sans types integres :\nnpm install --save-dev @types/lodash\n\n// Cela installe le fichier :\n// node_modules/@types/lodash/index.d.ts",
        options: [
          "C'est un outil de compilation TypeScript",
          "C'est un depot centralise de fichiers de declaration .d.ts pour les bibliotheques JavaScript, installe via @types/",
          "C'est un plugin VS Code pour l'autocompletion",
          "C'est un linter pour les fichiers .d.ts"
        ],
        answer: 1,
        explanation: "<strong>DefinitelyTyped</strong> est un depot GitHub communautaire qui heberge des fichiers de declaration pour des milliers de bibliotheques JavaScript. Les types sont publies sur npm sous le scope <code>@types/</code>. TypeScript les decouvre automatiquement dans <code>node_modules/@types/</code>."
      },
      {
        label: "Question 5",
        text: "Qu'est-ce que la declaration merging en TypeScript ?",
        code: "interface User {\n  name: string;\n}\n\ninterface User {\n  email: string;\n}\n\n// Resultat : User a les deux proprietes\nconst user: User = {\n  name: 'Alice',\n  email: 'alice@example.com'\n};",
        options: [
          "C'est une erreur : on ne peut pas declarer deux interfaces avec le meme nom",
          "La seconde declaration ecrase la premiere",
          "Les deux declarations sont fusionnees automatiquement en une seule interface",
          "Seules les proprietes communes sont conservees"
        ],
        answer: 2,
        explanation: "La <strong>declaration merging</strong> est un mecanisme ou TypeScript fusionne automatiquement plusieurs declarations portant le meme nom. Pour les interfaces, les membres sont combines. Cela fonctionne aussi entre interfaces et namespaces, ou entre enums et namespaces. C'est le mecanisme utilise par la module augmentation."
      }
    ];
    let currentQuestion = 0, score = 0, answered = false;
    function renderQuestion() {
      if (currentQuestion >= questions.length) { showScore(); return; }
      const q = questions[currentQuestion];
      const pct = (currentQuestion / questions.length) * 100;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressText').textContent = 'Question ' + (currentQuestion + 1) + ' / ' + questions.length;
      let html = '<div class="card">';
      html += '<div class="question-label">' + q.label + '</div>';
      html += '<div class="question-text">' + q.text + '</div>';
      if (q.code) html += '<pre><code>' + q.code + '</code></pre>';
      html += '<ul class="options">';
      q.options.forEach(function(opt, i) {
        html += '<li><label><input type="radio" name="q" value="' + i + '"> ' + opt + '</label></li>';
      });
      html += '</ul>';
      html += '<button class="btn btn-primary" id="validateBtn" onclick="validate()" disabled>Valider</button>';
      html += '<div class="feedback" id="feedback"></div>';
      html += '</div>';
      document.getElementById('quizContainer').innerHTML = html;
      document.getElementById('scoreContainer').classList.add('hidden');
      answered = false;
      document.querySelectorAll('input[name="q"]').forEach(function(input) {
        input.addEventListener('change', function() { document.getElementById('validateBtn').disabled = false; });
      });
    }
    function validate() {
      if (answered) return;
      answered = true;
      const selected = document.querySelector('input[name="q"]:checked');
      if (!selected) return;
      const val = parseInt(selected.value);
      const q = questions[currentQuestion];
      const fb = document.getElementById('feedback');
      if (val === q.answer) {
        score++;
        fb.className = 'feedback correct';
        fb.innerHTML = '<strong>Correct !</strong> ' + q.explanation;
      } else {
        fb.className = 'feedback wrong';
        fb.innerHTML = '<strong>Incorrect.</strong> ' + q.explanation;
      }
      document.getElementById('validateBtn').disabled = true;
      setTimeout(function() { currentQuestion++; renderQuestion(); }, 3000);
    }
    function showScore() {
      document.getElementById('quizContainer').innerHTML = '';
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('progressText').textContent = 'Terminé !';
      const sc = document.getElementById('scoreContainer');
      sc.classList.remove('hidden');
      const pct = Math.round((score / questions.length) * 100);
      let msg = pct >= 80 ? 'Excellent travail !' : pct >= 60 ? 'Bon travail, quelques points à revoir.' : 'Continuez à étudier, vous progresserez !';
      sc.innerHTML = '<div class="score">' + score + ' / ' + questions.length + '</div><div class="score-label">' + pct + '% — ' + msg + '</div><button class="btn-restart" onclick="restart()">Recommencer</button>';
    }
    function restart() { currentQuestion = 0; score = 0; answered = false; renderQuestion(); }
    renderQuestion();
  </script>
</body>
</html>
