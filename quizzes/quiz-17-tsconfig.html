<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 17 — tsconfig avance</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; color: #ffffff; }
    .subtitle { text-align: center; color: #8892b0; margin-bottom: 2rem; font-size: 1rem; }
    .progress-bar-container { background: #0d1117; border-radius: 10px; height: 14px; margin-bottom: 2rem; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #0d6efd, #4dabf7); height: 100%; width: 0%; border-radius: 10px; transition: width 0.4s ease; }
    .progress-text { text-align: center; color: #8892b0; margin-bottom: 1rem; font-size: 0.9rem; }
    .card { background: #16213e; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .question-label { font-size: 0.85rem; color: #4dabf7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .question-text { font-size: 1.15rem; margin-bottom: 1.2rem; line-height: 1.5; color: #ffffff; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; overflow-x: auto; font-size: 0.95rem; }
    code { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; color: #c9d1d9; }
    .options { list-style: none; }
    .options li { margin-bottom: 0.5rem; }
    .options label { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; background: #0d1117; border: 2px solid #30363d; border-radius: 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s; font-size: 1rem; }
    .options label:hover { border-color: #4dabf7; background: #1c2a4a; }
    .options input[type="radio"] { accent-color: #0d6efd; width: 18px; height: 18px; flex-shrink: 0; }
    .btn { display: inline-block; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-primary { background: #0d6efd; color: #fff; }
    .btn-primary:hover { background: #3b82f6; }
    .btn-primary:disabled { background: #374151; cursor: not-allowed; }
    .btn-restart { background: #238636; color: #fff; margin-top: 1rem; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-restart:hover { background: #2ea043; }
    .feedback { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; display: none; }
    .feedback.correct { background: #0f5132; border: 1px solid #198754; color: #d1fae5; display: block; }
    .feedback.wrong { background: #842029; border: 1px solid #dc3545; color: #fdd; display: block; }
    .score-card { text-align: center; padding: 3rem 2rem; }
    .score-card .score { font-size: 3rem; font-weight: 700; color: #4dabf7; margin-bottom: 0.5rem; }
    .score-card .score-label { font-size: 1.2rem; color: #8892b0; margin-bottom: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz 17 — tsconfig avance</h1>
    <p class="subtitle">Configuration, performance, project references</p>
    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    <p class="progress-text" id="progressText">Question 1 / 5</p>
    <div id="quizContainer"></div>
    <div id="scoreContainer" class="card score-card hidden"></div>
  </div>
  <script>
    const questions = [
      {
        label: "Question 1",
        text: "Comment configurer des alias de chemin (path aliases) dans tsconfig.json ?",
        code: "// tsconfig.json\n{\n  \"compilerOptions\": {\n    \"baseUrl\": \".\",\n    \"paths\": {\n      \"@core/*\": [\"src/core/*\"],\n      \"@utils/*\": [\"src/utils/*\"]\n    }\n  }\n}\n\n// Dans un fichier source :\nimport { helper } from '@utils/formatters';\n// equivalent a : import { helper } from 'src/utils/formatters'",
        options: [
          "paths seul suffit, baseUrl est facultatif",
          "baseUrl definit le point de reference des chemins relatifs, paths mappe des alias vers des chemins reels — les deux sont necessaires ensemble",
          "paths remplace completement les imports absolus par des imports relatifs",
          "paths n'est disponible que dans TypeScript 5.0 et au-dela"
        ],
        answer: 1,
        explanation: "<code>baseUrl</code> (souvent '.') fixe le point de depart pour resolver les modules non-relatifs. <code>paths</code> definit ensuite des alias avec des wildcards (*). Attention : TypeScript resout les alias au niveau de la verification de types uniquement. Pour que les fichiers JS emis fonctionnent, vous avez besoin d'un plugin bundler (ts-paths, @rollup/plugin-alias...) ou de tsconfig-paths a l'execution."
      },
      {
        label: "Question 2",
        text: "Quel est le role de l'option <code>lib</code> dans tsconfig.json ?",
        code: "{\n  \"compilerOptions\": {\n    \"target\": \"ES2020\",\n    \"lib\": [\"ES2020\", \"DOM\", \"DOM.Iterable\"]\n  }\n}",
        options: [
          "lib indique les fichiers source a inclure dans la compilation",
          "lib specifie les definitions de types (declarations de bibliotheque) disponibles au moment de la compilation — les APIs globales que TypeScript connait",
          "lib est un alias pour include et determine les fichiers a compiler",
          "lib est obsolete et remplace par types"
        ],
        answer: 1,
        explanation: "<code>lib</code> controle quelles declarations de bibliotheque TypeScript inclut dans la compilation. <code>ES2020</code> donne acces a Promise, Map, Set, BigInt... <code>DOM</code> donne acces a document, window, fetch... Si vous ne specifiez pas lib, TypeScript en choisit un par defaut selon <code>target</code>. Pour Node.js sans DOM, ne pas inclure <code>DOM</code> evite d'avoir fetch, window etc. comme globaux."
      },
      {
        label: "Question 3",
        text: "Que sont les project references et a quoi servent-elles ?",
        code: "// tsconfig.json (racine)\n{\n  \"references\": [\n    { \"path\": \"./packages/core\" },\n    { \"path\": \"./packages/api\" },\n    { \"path\": \"./packages/web\" }\n  ]\n}\n\n// packages/core/tsconfig.json\n{\n  \"compilerOptions\": {\n    \"composite\": true,\n    \"outDir\": \"./dist\"\n  }\n}",
        options: [
          "Elles importent des configurations depuis d'autres fichiers tsconfig",
          "Elles permettent de decouper un projet en sous-projets compiles independamment avec des dependances explicites",
          "Elles sont obligatoires dans tous les monorepos",
          "Elles remplacent les imports ES modules"
        ],
        answer: 1,
        explanation: "Les <strong>project references</strong> permettent de structurer un gros projet en sous-projets TypeScript independants. Chaque sous-projet a son propre <code>tsconfig.json</code> avec <code>composite: true</code>. L'option <code>tsc --build</code> compile alors chaque projet dans le bon ordre, avec un cache incremental. Cela ameliore considerablement les temps de compilation."
      },
      {
        label: "Question 4",
        text: "Comment fonctionne la compilation incrementale avec <code>incremental</code> ?",
        code: "{\n  \"compilerOptions\": {\n    \"incremental\": true,\n    \"tsBuildInfoFile\": \"./dist/.tsbuildinfo\"\n  }\n}",
        options: [
          "Elle recompile tous les fichiers a chaque execution",
          "Elle sauvegarde un fichier .tsbuildinfo et ne recompile que les fichiers modifies et leurs dependants",
          "Elle compile un fichier a la fois dans l'ordre alphabetique",
          "Elle ne fonctionne qu'avec les project references"
        ],
        answer: 1,
        explanation: "Avec <code>incremental: true</code>, TypeScript genere un fichier <code>.tsbuildinfo</code> qui contient les signatures et dependances de chaque fichier. Lors de la compilation suivante, seuls les fichiers modifies et ceux qui en dependent sont recompiles. Cela peut reduire considerablement les temps de build sur les gros projets."
      },
      {
        label: "Question 5",
        text: "Que fait l'option <code>isolatedModules</code> et pourquoi est-elle importante ?",
        code: "{\n  \"compilerOptions\": {\n    \"isolatedModules\": true\n  }\n}\n\n// Ceci provoque une erreur avec isolatedModules :\nconst enum Direction { Up, Down }\n//     ^^^^ Error: ne peut pas etre compile en isolation\n\nexport { Direction };",
        options: [
          "Elle empeche les imports circulaires",
          "Elle garantit que chaque fichier peut etre transpile independamment, ce qui est requis par les outils comme esbuild, swc ou Babel",
          "Elle isole chaque module dans un scope separe",
          "Elle desactive la resolution automatique des modules"
        ],
        answer: 1,
        explanation: "<code>isolatedModules: true</code> garantit que chaque fichier TypeScript peut etre transpile <strong>independamment</strong> sans connaitre le reste du projet. C'est necessaire pour les transpileurs fichier-par-fichier comme esbuild, swc ou Babel. Elle interdit les constructions qui necessitent une analyse globale, comme <code>const enum</code> reexporte ou les <code>namespace</code>."
      },
      {
        label: "Question 6",
        text: "Quelle combinaison d'options permet de generer des fichiers .d.ts sans emettre de JavaScript ?",
        code: "// Cas typique : librairie TypeScript\n// On veut les declarations pour les consommateurs\n// mais le JS est emis par le bundler\n{\n  \"compilerOptions\": {\n    \"declaration\": ???,\n    \"noEmit\": ???\n  }\n}",
        options: [
          "declaration: true, noEmit: false",
          "declaration: true, noEmit: true",
          "declarationOnly: true, noEmit: false",
          "declaration: true, emitDeclarationOnly: true"
        ],
        answer: 3,
        explanation: "<code>declaration: true</code> demande a TypeScript de generer les fichiers <code>.d.ts</code>. <code>emitDeclarationOnly: true</code> dit de n'emettre que ces declarations, sans generer les fichiers <code>.js</code>. C'est le pattern ideal pour une librairie compilee par un bundler (Rollup, esbuild) : TypeScript genere les types, le bundler genere le JS. <code>noEmit: true</code> ne fonctionne pas car il supprime aussi les <code>.d.ts</code>."
      }
    ];
    let currentQuestion = 0, score = 0, answered = false;
    function renderQuestion() {
      if (currentQuestion >= questions.length) { showScore(); return; }
      const q = questions[currentQuestion];
      const pct = (currentQuestion / questions.length) * 100;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressText').textContent = 'Question ' + (currentQuestion + 1) + ' / ' + questions.length;
      let html = '<div class="card">';
      html += '<div class="question-label">' + q.label + '</div>';
      html += '<div class="question-text">' + q.text + '</div>';
      if (q.code) html += '<pre><code>' + q.code + '</code></pre>';
      html += '<ul class="options">';
      q.options.forEach(function(opt, i) {
        html += '<li><label><input type="radio" name="q" value="' + i + '"> ' + opt + '</label></li>';
      });
      html += '</ul>';
      html += '<button class="btn btn-primary" id="validateBtn" onclick="validate()" disabled>Valider</button>';
      html += '<div class="feedback" id="feedback"></div>';
      html += '</div>';
      document.getElementById('quizContainer').innerHTML = html;
      document.getElementById('scoreContainer').classList.add('hidden');
      answered = false;
      document.querySelectorAll('input[name="q"]').forEach(function(input) {
        input.addEventListener('change', function() { document.getElementById('validateBtn').disabled = false; });
      });
    }
    function validate() {
      if (answered) return;
      answered = true;
      const selected = document.querySelector('input[name="q"]:checked');
      if (!selected) return;
      const val = parseInt(selected.value);
      const q = questions[currentQuestion];
      const fb = document.getElementById('feedback');
      if (val === q.answer) {
        score++;
        fb.className = 'feedback correct';
        fb.innerHTML = '<strong>Correct !</strong> ' + q.explanation;
      } else {
        fb.className = 'feedback wrong';
        fb.innerHTML = '<strong>Incorrect.</strong> ' + q.explanation;
      }
      document.getElementById('validateBtn').disabled = true;
      setTimeout(function() { currentQuestion++; renderQuestion(); }, 3000);
    }
    function showScore() {
      document.getElementById('quizContainer').innerHTML = '';
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('progressText').textContent = 'Terminé !';
      const sc = document.getElementById('scoreContainer');
      sc.classList.remove('hidden');
      const pct = Math.round((score / questions.length) * 100);
      let msg = pct >= 80 ? 'Excellent travail !' : pct >= 60 ? 'Bon travail, quelques points à revoir.' : 'Continuez à étudier, vous progresserez !';
      sc.innerHTML = '<div class="score">' + score + ' / ' + questions.length + '</div><div class="score-label">' + pct + '% — ' + msg + '</div><button class="btn-restart" onclick="restart()">Recommencer</button>';
    }
    function restart() { currentQuestion = 0; score = 0; answered = false; renderQuestion(); }
    renderQuestion();
  </script>
</body>
</html>
