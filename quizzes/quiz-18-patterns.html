<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 18 — Patterns de conception</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; color: #ffffff; }
    .subtitle { text-align: center; color: #8892b0; margin-bottom: 2rem; font-size: 1rem; }
    .progress-bar-container { background: #0d1117; border-radius: 10px; height: 14px; margin-bottom: 2rem; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #0d6efd, #4dabf7); height: 100%; width: 0%; border-radius: 10px; transition: width 0.4s ease; }
    .progress-text { text-align: center; color: #8892b0; margin-bottom: 1rem; font-size: 0.9rem; }
    .card { background: #16213e; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .question-label { font-size: 0.85rem; color: #4dabf7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .question-text { font-size: 1.15rem; margin-bottom: 1.2rem; line-height: 1.5; color: #ffffff; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; overflow-x: auto; font-size: 0.95rem; }
    code { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; color: #c9d1d9; }
    .options { list-style: none; }
    .options li { margin-bottom: 0.5rem; }
    .options label { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; background: #0d1117; border: 2px solid #30363d; border-radius: 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s; font-size: 1rem; }
    .options label:hover { border-color: #4dabf7; background: #1c2a4a; }
    .options input[type="radio"] { accent-color: #0d6efd; width: 18px; height: 18px; flex-shrink: 0; }
    .btn { display: inline-block; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-primary { background: #0d6efd; color: #fff; }
    .btn-primary:hover { background: #3b82f6; }
    .btn-primary:disabled { background: #374151; cursor: not-allowed; }
    .btn-restart { background: #238636; color: #fff; margin-top: 1rem; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-restart:hover { background: #2ea043; }
    .feedback { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; display: none; }
    .feedback.correct { background: #0f5132; border: 1px solid #198754; color: #d1fae5; display: block; }
    .feedback.wrong { background: #842029; border: 1px solid #dc3545; color: #fdd; display: block; }
    .score-card { text-align: center; padding: 3rem 2rem; }
    .score-card .score { font-size: 3rem; font-weight: 700; color: #4dabf7; margin-bottom: 0.5rem; }
    .score-card .score-label { font-size: 1.2rem; color: #8892b0; margin-bottom: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz 18 — Patterns de conception</h1>
    <p class="subtitle">Result, Builder, Strategy, pipe</p>
    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    <p class="progress-text" id="progressText">Question 1 / 5</p>
    <div id="quizContainer"></div>
    <div id="scoreContainer" class="card score-card hidden"></div>
  </div>
  <script>
    const questions = [
      {
        label: "Question 1",
        text: "Quel est l'avantage du pattern <code>Result&lt;T, E&gt;</code> par rapport aux exceptions en TypeScript ?",
        code: "type Result&lt;T, E&gt; =\n  | { ok: true; value: T }\n  | { ok: false; error: E };\n\nfunction divide(a: number, b: number): Result&lt;number, string&gt; {\n  if (b === 0) return { ok: false, error: 'Division par zero' };\n  return { ok: true, value: a / b };\n}\n\nconst result = divide(10, 0);\nif (result.ok) {\n  console.log(result.value); // type: number\n} else {\n  console.log(result.error); // type: string\n}",
        options: [
          "Il est plus rapide a l'execution que les exceptions",
          "Il rend les erreurs explicites dans le systeme de types, forcant le developpeur a les gerer",
          "Il remplace completement le mecanisme try/catch",
          "Il ne fonctionne qu'avec les types primitifs"
        ],
        answer: 1,
        explanation: "Le pattern <code>Result&lt;T, E&gt;</code> encode les erreurs dans le systeme de types via un discriminated union. Contrairement aux exceptions (qui sont de type <code>unknown</code>), le type d'erreur est <strong>explicite</strong> et le compilateur force le developpeur a verifier <code>ok</code> avant d'acceder a <code>value</code> ou <code>error</code> (narrowing)."
      },
      {
        label: "Question 2",
        text: "Comment le pattern Builder garantit-il la type-safety a la compilation ?",
        code: "class QueryBuilder&lt;HasTable extends boolean = false, HasWhere extends boolean = false&gt; {\n  private table = '';\n  private condition = '';\n\n  from(table: string): QueryBuilder&lt;true, HasWhere&gt; {\n    this.table = table;\n    return this as any;\n  }\n\n  where(cond: string): QueryBuilder&lt;HasTable, true&gt; {\n    this.condition = cond;\n    return this as any;\n  }\n\n  execute(this: QueryBuilder&lt;true, true&gt;): string {\n    return `SELECT * FROM ${this.table} WHERE ${this.condition}`;\n  }\n}",
        options: [
          "En utilisant des validations a l'execution dans chaque methode",
          "En utilisant des parametres de type generiques qui tracent l'etat du builder, empechant l'appel a execute() tant que les etapes requises ne sont pas completees",
          "En lancant des exceptions si l'ordre d'appel est incorrect",
          "En rendant toutes les methodes privees"
        ],
        answer: 1,
        explanation: "Ce pattern utilise des <strong>phantom types</strong> (parametres de type generiques) pour encoder l'etat du builder. <code>execute()</code> requiert <code>this: QueryBuilder&lt;true, true&gt;</code>, ce qui signifie que <code>from()</code> et <code>where()</code> doivent avoir ete appeles. L'erreur est detectee <strong>a la compilation</strong>, pas a l'execution."
      },
      {
        label: "Question 3",
        text: "Qu'est-ce qu'un branded type et a quoi sert-il ?",
        code: "type Brand&lt;T, B extends string&gt; = T &amp; { readonly __brand: B };\n\ntype EUR = Brand&lt;number, 'EUR'&gt;;\ntype USD = Brand&lt;number, 'USD'&gt;;\n\nfunction euroToUsd(amount: EUR): USD {\n  return (amount * 1.1) as USD;\n}\n\nconst price = 100 as EUR;\nconst converted = euroToUsd(price);    // OK\n// euroToUsd(100);                      // Error !\n// euroToUsd(100 as USD);               // Error !",
        options: [
          "C'est un alias de type ordinaire",
          "C'est un type nominal simule via une propriete fantome, empechant de melanger des valeurs structurellement identiques",
          "C'est un type qui ne fonctionne qu'avec les classes",
          "C'est un type genere automatiquement par TypeScript"
        ],
        answer: 1,
        explanation: "Un <strong>branded type</strong> ajoute une propriete fantome (<code>__brand</code>) qui n'existe pas a l'execution mais cree une distinction au niveau du systeme de types. Cela simule le typage <strong>nominal</strong> dans le systeme structurel de TypeScript, empechant par exemple de passer des USD la ou des EUR sont attendus."
      },
      {
        label: "Question 4",
        text: "Comment typer une fonction <code>pipe</code> qui compose des fonctions de gauche a droite ?",
        code: "function pipe&lt;A, B&gt;(fn1: (a: A) =&gt; B): (a: A) =&gt; B;\nfunction pipe&lt;A, B, C&gt;(fn1: (a: A) =&gt; B, fn2: (b: B) =&gt; C): (a: A) =&gt; C;\nfunction pipe&lt;A, B, C, D&gt;(\n  fn1: (a: A) =&gt; B, fn2: (b: B) =&gt; C, fn3: (c: C) =&gt; D\n): (a: A) =&gt; D;\nfunction pipe(...fns: Function[]) {\n  return (x: any) =&gt; fns.reduce((v, f) =&gt; f(v), x);\n}\n\nconst transform = pipe(\n  (x: string) =&gt; x.length,\n  (n: number) =&gt; n &gt; 5\n);\n// transform: (a: string) =&gt; boolean",
        options: [
          "En utilisant un seul type generique pour toutes les fonctions",
          "En utilisant des surcharges de fonctions (overloads) avec des generiques chainables",
          "En typant le retour comme 'any'",
          "Ce n'est pas possible a typer en TypeScript"
        ],
        answer: 1,
        explanation: "Le typage de <code>pipe</code> utilise des <strong>surcharges de fonctions</strong> (overloads) pour chainer les types generiques. Le type de sortie de chaque fonction (<code>B</code>, <code>C</code>, <code>D</code>...) correspond au type d'entree de la suivante. TypeScript infere automatiquement la chaine de types."
      },
      {
        label: "Question 5",
        text: "Qu'est-ce que le pattern type-state et quel probleme resout-il ?",
        code: "interface Disconnected { state: 'disconnected'; }\ninterface Connected { state: 'connected'; sessionId: string; }\ninterface Authenticated { state: 'authenticated'; sessionId: string; userId: string; }\n\ntype Client = Disconnected | Connected | Authenticated;\n\nfunction login(client: Connected, credentials: {user: string; pass: string}): Authenticated {\n  return { state: 'authenticated', sessionId: client.sessionId, userId: credentials.user };\n}\n\n// login(disconnectedClient, creds); // Erreur de compilation !",
        options: [
          "Il remplace les machines a etats par des classes",
          "Il encode les etats d'un objet dans le systeme de types, rendant les transitions invalides impossibles a compiler",
          "Il sert uniquement a documenter le code",
          "Il cree des etats dynamiques a l'execution"
        ],
        answer: 1,
        explanation: "Le <strong>type-state pattern</strong> encode les etats d'un objet comme des types distincts. Les fonctions de transition specifient dans leur signature quel etat est requis en entree et quel etat est produit en sortie. Ici, <code>login()</code> ne peut etre appelee que sur un client <code>Connected</code>, pas <code>Disconnected</code>. Les transitions invalides sont des erreurs de compilation."
      }
    ];
    let currentQuestion = 0, score = 0, answered = false;
    function renderQuestion() {
      if (currentQuestion >= questions.length) { showScore(); return; }
      const q = questions[currentQuestion];
      const pct = (currentQuestion / questions.length) * 100;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressText').textContent = 'Question ' + (currentQuestion + 1) + ' / ' + questions.length;
      let html = '<div class="card">';
      html += '<div class="question-label">' + q.label + '</div>';
      html += '<div class="question-text">' + q.text + '</div>';
      if (q.code) html += '<pre><code>' + q.code + '</code></pre>';
      html += '<ul class="options">';
      q.options.forEach(function(opt, i) {
        html += '<li><label><input type="radio" name="q" value="' + i + '"> ' + opt + '</label></li>';
      });
      html += '</ul>';
      html += '<button class="btn btn-primary" id="validateBtn" onclick="validate()" disabled>Valider</button>';
      html += '<div class="feedback" id="feedback"></div>';
      html += '</div>';
      document.getElementById('quizContainer').innerHTML = html;
      document.getElementById('scoreContainer').classList.add('hidden');
      answered = false;
      document.querySelectorAll('input[name="q"]').forEach(function(input) {
        input.addEventListener('change', function() { document.getElementById('validateBtn').disabled = false; });
      });
    }
    function validate() {
      if (answered) return;
      answered = true;
      const selected = document.querySelector('input[name="q"]:checked');
      if (!selected) return;
      const val = parseInt(selected.value);
      const q = questions[currentQuestion];
      const fb = document.getElementById('feedback');
      if (val === q.answer) {
        score++;
        fb.className = 'feedback correct';
        fb.innerHTML = '<strong>Correct !</strong> ' + q.explanation;
      } else {
        fb.className = 'feedback wrong';
        fb.innerHTML = '<strong>Incorrect.</strong> ' + q.explanation;
      }
      document.getElementById('validateBtn').disabled = true;
      setTimeout(function() { currentQuestion++; renderQuestion(); }, 3000);
    }
    function showScore() {
      document.getElementById('quizContainer').innerHTML = '';
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('progressText').textContent = 'Terminé !';
      const sc = document.getElementById('scoreContainer');
      sc.classList.remove('hidden');
      const pct = Math.round((score / questions.length) * 100);
      let msg = pct >= 80 ? 'Excellent travail !' : pct >= 60 ? 'Bon travail, quelques points à revoir.' : 'Continuez à étudier, vous progresserez !';
      sc.innerHTML = '<div class="score">' + score + ' / ' + questions.length + '</div><div class="score-label">' + pct + '% — ' + msg + '</div><button class="btn-restart" onclick="restart()">Recommencer</button>';
    }
    function restart() { currentQuestion = 0; score = 0; answered = false; renderQuestion(); }
    renderQuestion();
  </script>
</body>
</html>
